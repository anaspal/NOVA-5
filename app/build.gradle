plugins { id 'com.android.application' }
android {
    namespace 'com.example.callhelper'
    compileSdk 33
    buildToolsVersion '33.0.2'
    defaultConfig {
        applicationId "com.example.callhelper"
        minSdk 26
        targetSdk 33
        versionCode 22
        versionName "10.9.2"
        // Redmi Note 8 = arm64. نُبقي armeabi-v7a أيضاً للأجهزة الأقدم ونستبعد x86 لتقليل حجم APK.
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    buildTypes { release { minifyEnabled false } }
    androidResources { noCompress += ['onnx', 'ort'] }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {
    // Offline neural TTS runtime (Android AAR + native libraries).
    // ملف AAR الرسمي يُنزَّل من GitHub Releases داخل workflow إلى app/libs (انظر android-apk.yml).
    implementation files('libs/sherpa-onnx-1.13.5.aar')
    // مكتبة sherpa مكتوبة بـ Kotlin ولا تحمل معها kotlin-stdlib، فنضيفها يدوياً.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}
